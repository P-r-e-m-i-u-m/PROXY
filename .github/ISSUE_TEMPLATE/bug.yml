name: Bug report
description: Report gateway behavior that is broken or unexpected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the issue clearly.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: |
        1. Configure provider...
        2. Run command...
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks
      value: |
        - [ ] I removed API keys and private data
        - [ ] I checked `/health`
        - [ ] I ran `npm run check`
